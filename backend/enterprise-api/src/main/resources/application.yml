spring:
  application:
    name: enterprise-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/autonomous_enterprise_ai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    com.autonomousenterprise.api: INFO
